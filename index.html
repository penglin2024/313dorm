<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>penglin2024 | 个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      padding: 48px 56px;
      max-width: 640px;
      width: 100%;
      text-align: center;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 40px;
      font-weight: 700;
      line-height: 96px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 28px; color: #1f2937; margin-bottom: 8px; }
    .handle { color: #6b7280; font-size: 15px; margin-bottom: 20px; }
    p.bio { color: #4b5563; font-size: 16px; line-height: 1.8; margin-bottom: 24px; }
    .links a {
      display: inline-block;
      margin: 6px 8px;
      padding: 8px 18px;
      border-radius: 999px;
      background: #eff6ff;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.2s;
    }
    .links a:hover { background: #dbeafe; }
    footer { margin-top: 28px; color: #9ca3af; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">P</div>
    <h1>你好，我是 penglin2024</h1>
    <div class="handle">@penglin2024</div>
    <p class="bio">
      这是我的 GitHub Pages 个人主页。<br>
      （在此替换为你的简介：介绍你是谁、做什么、感兴趣的方向等。）
    </p>
    <div class="links">
      <a href="https://github.com/penglin2024" target="_blank" rel="noopener">GitHub</a>
      <a href="#" onclick="return false;">（添加你的其他链接，如博客/邮箱）</a>
    </div>
    <footer>Powered by GitHub Pages</footer>
  </div>
</body>
</html>
