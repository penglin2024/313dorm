/* ============================================================
 * 逻辑
 * ============================================================ */
const LETTERS = ['A','B','C','D','E'];
const STORAGE_PREFIX = 'marx-quiz-v3-';
const quizEl = document.getElementById('quiz');
const tabsEl = document.getElementById('tabs');
const resetBtn = document.getElementById('resetBtn');
const resetMini = document.getElementById('resetMini');
const elChapter = document.getElementById('s-chapter');
const elDone = document.getElementById('s-done');
const elTotal = document.getElementById('s-total');
const elOk = document.getElementById('s-ok');
const elBad = document.getElementById('s-bad');
const elRate = document.getElementById('s-rate');
const saveHint = document.getElementById('saveHint');

let storageOK = true;
try {
  localStorage.setItem('__t', '1');
  localStorage.removeItem('__t');
} catch (e) { storageOK = false; }

let currentIdx = 0;
let session = null;
let states = [];
let ansDisplay = [];
let currentQuestions = [];
let restoring = false;
let flashTimer = null;
let toastTimer = null;

/* ---------- 工具 ---------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

function buildChapter(chIdx) {
  const ch = CHAPTERS[chIdx];
  return ch.qs.map((q, i) => ({
    id: 'q' + i,
    type: q[0] === 'm' ? 'multi' : 'single',
    q: q[1],
    opts: q[2],
    ans: q[3]
  }));
}

/* ---------- 保存 ---------- */
function save() {
  if (restoring || !storageOK || !session) return;
  const ts = Date.now();
  const data = states.map(s => ({
    sel: [...s.sel].sort(),
    locked: s.locked,
    ok: s.result
  }));
  try {
    localStorage.setItem(STORAGE_PREFIX + CHAPTERS[currentIdx].id, JSON.stringify({
      v: 3, ts, session, data
    }));
    showSaved(ts, false);
  } catch (e) {
    storageOK = false;
    saveHint.textContent = '当前浏览器不支持自动保存';
  }
}

function showSaved(ts, restored) {
  if (!storageOK) return;
  const t = new Date(ts);
  const hh = String(t.getHours()).padStart(2, '0');
  const mm = String(t.getMinutes()).padStart(2, '0');
  saveHint.textContent = restored
    ? `已恢复上次进度 · 保存于 ${hh}:${mm}`
    : `已自动保存 ${hh}:${mm}`;
  saveHint.classList.add('flash');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => saveHint.classList.remove('flash'), 1200);
}

/* ---------- 统计 ---------- */
function updateStats() {
  const total = states.length;
  const done = states.filter(s => s.result !== null).length;
  const ok = states.filter(s => s.result === true).length;
  const bad = states.filter(s => s.result === false).length;
  elChapter.textContent = CHAPTERS[currentIdx].name;
  elTotal.textContent = total;
  elDone.textContent = done;
  elOk.textContent = ok;
  elBad.textContent = bad;
  elRate.textContent = done === 0 ? '—' : Math.round(ok / done * 100) + '%';
}

function updateTabsDone() {
  const tab = tabsEl.children[currentIdx];
  if (!tab) return;
  const done = states.filter(s => s.result !== null).length;
  const span = tab.querySelector('.done-num');
  if (span) span.textContent = `${done}/${currentQuestions.length}`;
}

/* 从存储读取所有章节完成数，刷新全部标签 */
function refreshAllTabDone() {
  if (!storageOK) return;
  CHAPTERS.forEach((ch, i) => {
    const tab = tabsEl.children[i];
    if (!tab) return;
    const span = tab.querySelector('.done-num');
    if (!span) return;
    let done = 0;
    try {
      const raw = localStorage.getItem(STORAGE_PREFIX + ch.id);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.data)) {
          done = parsed.data.filter(d => d && d.locked).length;
        }
      }
    } catch (e) {}
    span.textContent = `${done}/${ch.qs.length}`;
  });
}

/* ---------- 标签渲染 ---------- */
function renderTabs() {
  tabsEl.innerHTML = '';
  CHAPTERS.forEach((ch, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === currentIdx ? ' active' : '');
    btn.dataset.idx = i;
    btn.textContent = ch.name;
    const s = document.createElement('span');
    s.className = 'done-num';
    s.textContent = `0/${ch.qs.length}`;
    btn.appendChild(s);
    btn.addEventListener('click', () => switchChapter(i));
    tabsEl.appendChild(btn);
  });
}

/* ---------- 会话 ---------- */
function newSession(questions) {
  const singles = questions.filter(q => q.type === 'single');
  const multis = questions.filter(q => q.type === 'multi');
  const order = shuffle(singles).concat(shuffle(multis)).map(q => q.id);
  const optOrder = {};
  order.forEach(id => {
    const q = questions.find(x => x.id === id);
    optOrder[id] = shuffle(q.opts.map((_, i) => i));
  });
  return { order, optOrder };
}

/* ---------- 构建界面 ---------- */
function buildUI(sess) {
  quizEl.innerHTML = '';
  states = [];
  ansDisplay = [];

  const qMap = {};
  currentQuestions.forEach(q => { qMap[q.id] = q; });

  sess.order.forEach((id, qi) => {
    const q = qMap[id];
    const optIdxOrder = sess.optOrder[id];

    const ansSet = new Set(
      q.ans.split('').map(L => {
        const origIdx = LETTERS.indexOf(L);
        return LETTERS[optIdxOrder.indexOf(origIdx)];
      })
    );
    ansDisplay.push(ansSet);
    states.push({ sel: new Set(), locked: false, result: null });

    const card = document.createElement('section');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'q-head';
    const tag = q.type === 'multi' ? '<span class="tag">多选</span>' : '';
    head.innerHTML = `<span class="num">${qi + 1}</span><span class="q-text">${q.q}</span>${tag}`;
    card.appendChild(head);

    const optsBox = document.createElement('div');
    optsBox.className = 'opts';
    const dispOpts = optIdxOrder.map(origIdx => q.opts[origIdx]);

    dispOpts.forEach((text, oi) => {
      const letter = LETTERS[oi];
      const label = document.createElement('label');
      label.className = 'opt';
      label.innerHTML =
        `<input type="${q.type === 'single' ? 'radio' : 'checkbox'}"
                name="q${qi}" value="${letter}">
         <span class="badge">${letter}</span>
         <span class="opt-text">${text}</span>`;

      const input = label.querySelector('input');
      input.addEventListener('change', () => {
        if (states[qi].locked) return;
        if (q.type === 'single') {
          optsBox.querySelectorAll('.opt').forEach(l => l.classList.remove('sel'));
          label.classList.add('sel');
          states[qi].sel = new Set([letter]);
          judge(qi, card, optsBox);
        } else {
          if (input.checked) states[qi].sel.add(letter);
          else states[qi].sel.delete(letter);
          label.classList.toggle('sel', input.checked);
          liveCheckMulti(qi, card, optsBox,
                         card.querySelector('.feedback'),
                         card.querySelector('.confirm-btn'));
        }
      });

      optsBox.appendChild(label);
    });
    card.appendChild(optsBox);

    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'confirm-btn';
    confirmBtn.textContent = '确认本题';
    confirmBtn.addEventListener('click', () => {
      if (states[qi].locked) return;
      judge(qi, card, optsBox);
    });
    card.appendChild(confirmBtn);

    const fb = document.createElement('div');
    fb.className = 'feedback';
    card.appendChild(fb);

    quizEl.appendChild(card);
  });
}

/* ---------- 多选题实时检测 ---------- */
function liveCheckMulti(qi, card, optsBox, fb, confirmBtn) {
  const mine = states[qi].sel;
  const ans = ansDisplay[qi];

  if (mine.size === 0) {
    card.className = 'card';
    fb.style.display = 'none';
    confirmBtn.classList.remove('show');
    save();
    return;
  }

  if ([...mine].some(L => !ans.has(L))) {
    judge(qi, card, optsBox);
    return;
  }

  if (mine.size === ans.size && [...ans].every(L => mine.has(L))) {
    judge(qi, card, optsBox);
    return;
  }

  card.className = 'card';
  fb.style.display = 'block';
  fb.innerHTML = `<span class="hint">已选 ${[...mine].sort().join('、')} 　继续勾选，或点击「确认本题」提交。</span>`;
  confirmBtn.classList.add('show');
  save();
}

/* ---------- 判分 ---------- */
function judge(qi, card, optsBox) {
  if (states[qi].locked) return;
  const mine = states[qi].sel;
  const ans = ansDisplay[qi];
  const isCorrect = mine.size === ans.size && [...ans].every(L => mine.has(L));

  states[qi].locked = true;
  states[qi].result = isCorrect;
  card.classList.add(isCorrect ? 'ok' : 'bad');

  optsBox.querySelectorAll('.opt').forEach((label, oi) => {
    const letter = LETTERS[oi];
    label.classList.remove('sel');
    label.classList.add('done');
    label.querySelector('input').disabled = true;
    if (ans.has(letter)) label.classList.add('correct');
    else if (mine.has(letter)) label.classList.add('wrong');
  });

  card.querySelector('.confirm-btn').classList.remove('show');

  const mineText = [...mine].sort().join('') || '未作答';
  const fb = card.querySelector('.feedback');
  fb.style.display = 'block';
  fb.innerHTML = isCorrect
    ? `✅ 回答正确　正确答案：<span class="ans">${[...ans].sort().join('')}</span>`
    : `❌ 回答错误　正确答案：<span class="ans">${[...ans].sort().join('')}</span>　你的选择：${mineText}`;

  updateStats();
  updateTabsDone();
  save();
}

/* ---------- 恢复 ---------- */
function restore(chIdx) {
  if (!storageOK) return false;
  const ch = CHAPTERS[chIdx];
  const validIds = new Set(currentQuestions.map(q => q.id));

  let raw;
  try { raw = localStorage.getItem(STORAGE_PREFIX + ch.id); } catch (e) { return false; }
  if (!raw) return false;

  let parsed;
  try { parsed = JSON.parse(raw); } catch (e) { return false; }
  if (!parsed || parsed.v !== 3) return false;

  const s = parsed.session;
  if (!s || !Array.isArray(s.order) || s.order.length !== currentQuestions.length) return false;
  if (!s.optOrder) return false;

  const seen = new Set();
  let sawMulti = false;
  for (const id of s.order) {
    if (!validIds.has(id) || seen.has(id)) return false;
    seen.add(id);
    const q = currentQuestions.find(x => x.id === id);
    if (!q) return false;
    if (q.type === 'multi') sawMulti = true;
    else if (sawMulti) return false;
    const oo = s.optOrder[id];
    if (!Array.isArray(oo) || oo.length !== q.opts.length) return false;
    const sorted = [...oo].sort((a, b) => a - b);
    for (let i = 0; i < sorted.length; i++) if (sorted[i] !== i) return false;
  }

  if (!Array.isArray(parsed.data) || parsed.data.length !== s.order.length) return false;

  session = s;
  buildUI(session);

  restoring = true;
  parsed.data.forEach((d, qi) => {
    if (!d) return;
    const card = quizEl.children[qi];
    const q = currentQuestions.find(x => x.id === session.order[qi]);
    if (!card || !q) return;
    const optsBox = card.querySelector('.opts');
    const labels = [...optsBox.querySelectorAll('.opt')];
    const validLetters = LETTERS.slice(0, q.opts.length);
    const sel = Array.isArray(d.sel) ? d.sel.filter(L => validLetters.includes(L)) : [];

    states[qi].sel = new Set(sel);
    sel.forEach(L => {
      const label = labels[LETTERS.indexOf(L)];
      if (!label) return;
      label.querySelector('input').checked = true;
      label.classList.add('sel');
    });

    if (d.locked) {
      judge(qi, card, optsBox);
    } else if (q.type === 'multi' && sel.length > 0) {
      liveCheckMulti(qi, card, optsBox,
                     card.querySelector('.feedback'),
                     card.querySelector('.confirm-btn'));
    }
  });
  restoring = false;

  updateStats();
  updateTabsDone();
  if (parsed.ts) showSaved(parsed.ts, true);
  return true;
}

/* ---------- 切换章节 ---------- */
function switchChapter(idx) {
  if (session) save();
  currentIdx = idx;
  currentQuestions = buildChapter(idx);
  [...tabsEl.children].forEach((t, i) => t.classList.toggle('active', i === idx));

  if (!restore(idx)) {
    session = newSession(currentQuestions);
    buildUI(session);
    updateStats();
    updateTabsDone();
    if (storageOK) saveHint.textContent = `【${CHAPTERS[idx].name}】进度自动保存`;
  }
  updateStats();
  updateTabsDone();
  refreshAllTabDone();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- 重置当前章节 ---------- */
function resetCurrentChapter() {
  const ch = CHAPTERS[currentIdx];
  if (!confirm(`确定清空【${ch.name}】所有作答，并重新打乱题目与选项顺序吗？`)) return;

  try { localStorage.removeItem(STORAGE_PREFIX + ch.id); } catch (e) {}

  currentQuestions = buildChapter(currentIdx);
  session = newSession(currentQuestions);
  buildUI(session);
  updateStats();
  updateTabsDone();
  save();
  refreshAllTabDone();

  showToast(`【${ch.name}】已重新开始，题目与选项顺序已打乱`);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- 初始化 ---------- */
renderTabs();
currentIdx = 0;
currentQuestions = buildChapter(0);
if (!restore(0)) {
  session = newSession(currentQuestions);
  buildUI(session);
  updateStats();
  updateTabsDone();
}
updateStats();
refreshAllTabDone();

/* ---------- 事件绑定 ---------- */
resetBtn.addEventListener('click', resetCurrentChapter);
resetMini.addEventListener('click', resetCurrentChapter);
</script>
